name: majadigi_mobile_rebuild
description: "Majadigi Mobile App made in Flutter 2026."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  cached_network_image: ^3.4.1
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.5
  zstandard: ^1.5.0
  async: ^2.13.1
  flutter_native_splash: ^2.4.7
  go_router: ^17.2.3
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  flutter_cache_manager: ^3.4.1
  flutter_secure_storage: ^10.1.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  flutter_map: ^8.3.0
  flutter_map_location_marker: ^10.2.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  expandable_page_view: ^1.3.0
  image_picker: ^1.2.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.13.1
  isar_community_generator: ^3.3.2
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/splash/majadigi-main-logo.png
    - assets/splash/majadigi-main-logo-960px.png
    - assets/splash/majadigi-main-text.png
    - assets/majadigi-main-logo-with-text.png
  #   - images/a_dot_ham.jpeg

  deferred-components:
    - name: transjatim_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/transjatim/presentation/screens/tj_screen.dart
        - package:majadigi_mobile_rebuild/deferred/transjatim/presentation/screens/tj_search_screen.dart
        - package:majadigi_mobile_rebuild/deferred/transjatim/presentation/screens/tj_detail_screen.dart
    - name: siskaperbapo_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/siskaperbapo/presentation/screens/siskaperbapo_screen.dart
        - package:majadigi_mobile_rebuild/deferred/siskaperbapo/presentation/screens/siskaperbapo_detail_screen.dart
    - name: sinaker_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/sinaker/presentation/screens/sinaker_main_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sinaker/presentation/screens/sinaker_register_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sinaker/presentation/screens/sinaker_status_screen.dart
    - name: sidita_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_main_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_destination_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_destination_detail_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_hotel_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_hotel_detail_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_event_screen.dart
        - package:majadigi_mobile_rebuild/deferred/sidita/presentation/screens/sidita_event_detail_screen.dart
    - name: rssa_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/rssa/presentation/screens/rssa_screen.dart
    - name: nomor_darurat_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/nomor_darurat/presentations/screens/noda_screen.dart
    - name: klinik_hoaks_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/klinik_hoaks/presentation/screens/klinik_hoaks_main_screen.dart
        - package:majadigi_mobile_rebuild/deferred/klinik_hoaks/presentation/screens/klinik_hoaks_detail_screen.dart
        - package:majadigi_mobile_rebuild/deferred/klinik_hoaks/presentation/screens/klinik_hoaks_report_screen.dart
        - package:majadigi_mobile_rebuild/deferred/klinik_hoaks/presentation/screens/klinik_hoaks_track_screen.dart
    - name: jdih_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/jdih/presentation/jdih_screen.dart
        - package:majadigi_mobile_rebuild/deferred/jdih/presentation/jdih_search_screen.dart
        - package:majadigi_mobile_rebuild/deferred/jdih/presentation/jdih_detail_screen.dart
        - package:majadigi_mobile_rebuild/deferred/jdih/presentation/jdih_category_screen.dart
    - name: bapenda_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/bapenda/presentation/screens/bapenda_screen.dart
    - name: bansos_module
      libraries:
        - package:majadigi_mobile_rebuild/deferred/bansos/presentation/screens/bansos_screen.dart
        - package:majadigi_mobile_rebuild/deferred/bansos/presentation/screens/bansos_info_screen.dart
        - package:majadigi_mobile_rebuild/deferred/bansos/presentation/screens/bansos_detail_screen.dart
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

